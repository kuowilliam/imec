image_size: [640, 360]  # [width, height]
camera_channel: CAM_FRONT
class_name: pedestrian

radar:
  channels:
    - RADAR_FRONT
  nsweeps: 5

train:
  dataroot: v1.0-mini
  epochs: 100
  batch_size: 2
  num_samples: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  device: auto
  checkpoint: checkpoints/overfit_best.pt

evaluation:
  dataroot: v1.0-mini
  checkpoint: checkpoints/overfit_best.pt
  split: mini_train
  num_samples: 16
  batch_size: 2
  num_workers: 0
  device: auto
  score_threshold: 0.01
  visualization_score_threshold: 0.1
  top_k: 100
  report_iou_threshold: 0.5
  report_score_threshold: 0.1
  iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  save_visualizations: true
  max_visualizations: 16
  output_dir: outputs/evaluation
