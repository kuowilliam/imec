image_size: [640, 360]  # [width, height]
camera_channel: CAM_FRONT
class_name: pedestrian

radar:
  channels:
    - RADAR_FRONT
  nsweeps: 5

dataset:
  version: v1.0-trainval
  available_scenes_only: true
  scene_manifests:
    train: src/config/splits/train_scenes.txt
    val: src/config/splits/val_scenes.txt

model:
  fusion:
    scales: [s4, s8, s16]
    window_size: 5
    vertical_neighbor_windows: 1
    window_batch_bucket_size: 32
    dropout: 0.1
  radar_relevance:
    enabled: true
    loss_weight: 0.1

# Training split only. Validation and evaluation never apply these.
augmentation:
  photometric:
    enabled: false
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
  horizontal_flip:
    enabled: false
    probability: 0.5

train:
  dataroot: v1.0-trainval-parts1-2
  split: train
  val_split: val
  frame_stride: 2
  validation_interval: 2
  progress_interval: 25
  epochs: 100
  batch_size: 2
  num_samples: null
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  device: auto
  checkpoint: checkpoints/v2_local_multiscale_best.pt
  history: outputs/v2_local_multiscale_history.json
  early_stopping_patience: 5  # Number of validation checks.

evaluation:
  dataroot: v1.0-trainval-parts1-2
  checkpoint: checkpoints/v2_local_multiscale_best.pt
  split: val
  num_samples: null
  batch_size: 2
  num_workers: 0
  device: auto
  score_threshold: 0.001
  visualization_score_threshold: 0.1
  top_k: 100
  report_iou_threshold: 0.5
  report_score_threshold: 0.1
  iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  save_visualizations: true
  max_visualizations: 10
  output_dir: outputs/v2_local_multiscale_val
